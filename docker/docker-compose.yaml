name: liguan-tourism

services:
  mysql:
    image: mysql:8.4
    container_name: liguan-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_EXPOSE_PORT:-13006}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-1}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-chat_db}
      TZ: Asia/Shanghai
    volumes:
      - ./volume/mysql/data:/var/lib/mysql
      - ./my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./init_sql.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_PASSWORD:-1}"]
      interval: 5s
      timeout: 4s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: liguan-redis
    restart: unless-stopped
    ports:
      - "${REDIS_EXPOSE_PORT:-16379}:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-liguan_dev_redis}
    volumes:
      - ./volume/redis/data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-liguan_dev_redis} ping | grep PONG"]
      interval: 5s
      timeout: 4s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: liguan-minio
    restart: unless-stopped
    ports:
      - "${MINIO_EXPOSE_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_PORT:-19001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-12345678}
    command: server /data --console-address ":9001"
    volumes:
      - ./volume/minio/data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 4s
      retries: 30

  neo4j:
    image: neo4j:5.26.11-ubi9
    container_name: liguan-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j123}
      apoc.export.file.enabled: "true"
      apoc.import.file.enabled: "true"
      apoc.import.file.use_neo4j_config: "true"
    volumes:
      - ./volume/neo4j/data:/data
      - ./volume/neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 8s
      timeout: 5s
      retries: 30
