[project]
name = "liguan-tourism-opinion"
version = "1.0.0"
description = "Guilin tourism public-opinion intelligence platform with hybrid RAG and knowledge graph evidence."
authors = [
    { name = "Liguan Contributors" }
]
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }


dependencies = [
    "sanic>=24.6.0,<25.0.0",
    "sqlalchemy>=2.0.31,<3.0.0",
    "requests>=2.32.3,<3.0.0",
    "httpx>=0.27.0,<1.0.0",
    "redis>=5.0.7,<6.0.0",
    "numpy==1.26.4",
    "pandas>=2.2.0,<3.0.0",
    "python-docx>=1.1.2,<2.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "minio>=7.2.8,<8.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "sanic-ext>=23.12.0,<24.0.0",
    "pymupdf>=1.25.2,<2.0.0",
    "pymysql>=1.1.1",
    "openai>=1.97.0",
    "langchain-core>=0.3.72,<1.0.0",
    "langgraph>=0.6.3",
    "langchain-openai>=0.3.28",
    "pydantic>=2.11.7",
    "py2neo>=2021.2.4",
    "pymupdf4llm>=0.0.27",
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "colorlog>=6.9.0",
    "faiss-cpu>=1.12.0",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
